name: Lean proofs

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Verify formalisation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lake artifacts
        uses: actions/cache@v4
        with:
          path: lean/.lake
          key: lake-${{ hashFiles('lean/lean-toolchain') }}
          restore-keys: lake-

      - name: Generate manifest
        working-directory: lean
        run: lake update

      - name: Build and check proofs
        working-directory: lean
        run: lake build
